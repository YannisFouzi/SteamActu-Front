apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ⚠️ CODE PUSH : Auto-linking gère l'intégration (pas besoin de script codepush.gradle)

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.steamnews"
    defaultConfig {
        applicationId "com.steamactu.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: 'com.google.gms.google-services'

// Fix autolinking CMake file to handle missing codegen directories
project.afterEvaluate {
    def autolinkingTask = tasks.findByName("generateAutolinkingNewArchitectureFiles")
    if (autolinkingTask != null) {
        autolinkingTask.doLast {
            def cmakeFile = file("${buildDir}/generated/autolinking/src/main/jni/Android-autolinking.cmake")
            if (cmakeFile.exists()) {
                def content = cmakeFile.text
                def modified = false
                
                // Check if async-storage codegen CMakeLists.txt exists
                def asyncStorageCodegenCmake = file("${project.rootDir}/../node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni/CMakeLists.txt")
                def hasAsyncStorageCodegen = asyncStorageCodegenCmake.exists()
                
                // Check if gesture-handler codegen CMakeLists.txt exists
                def gestureHandlerCodegenCmake = file("${project.rootDir}/../node_modules/react-native-gesture-handler/android/build/generated/source/codegen/jni/CMakeLists.txt")
                def hasGestureHandlerCodegen = gestureHandlerCodegenCmake.exists()
                
                // Remove add_subdirectory calls and library references if codegen doesn't exist
                if (!hasAsyncStorageCodegen) {
                    // Remove the add_subdirectory line (with or without if/endif wrapper)
                    content = content.replaceAll(/(?m)^if\(EXISTS[^\n]*async-storage[^\n]*\)\s*\n\s*add_subdirectory\([^\n]*rnasyncstorage_autolinked_build\)\s*\nendif\(\)\s*\n?/, '')
                    content = content.replaceAll(/(?m)^add_subdirectory\([^\n]*async-storage[^\n]*rnasyncstorage_autolinked_build\)\s*\n?/, '')
                    // Remove from AUTOLINKED_LIBRARIES
                    content = content.replaceAll(/\s+react_codegen_rnasyncstorage\s+/, ' ')
                    content = content.replaceAll(/\s+react_codegen_rnasyncstorage\n/, '\n')
                    modified = true
                }
                
                if (!hasGestureHandlerCodegen) {
                    // Remove the add_subdirectory line (with or without if/endif wrapper)
                    content = content.replaceAll(/(?m)^if\(EXISTS[^\n]*gesture-handler[^\n]*\)\s*\n\s*add_subdirectory\([^\n]*rngesturehandler_codegen_autolinked_build\)\s*\nendif\(\)\s*\n?/, '')
                    content = content.replaceAll(/(?m)^add_subdirectory\([^\n]*gesture-handler[^\n]*rngesturehandler_codegen_autolinked_build\)\s*\n?/, '')
                    // Remove from AUTOLINKED_LIBRARIES
                    content = content.replaceAll(/\s+react_codegen_rngesturehandler_codegen\s+/, ' ')
                    content = content.replaceAll(/\s+react_codegen_rngesturehandler_codegen\n/, '\n')
                    modified = true
                }
                
                if (modified) {
                    cmakeFile.text = content
                }
            }
            
            // Also clean up autolinking.cpp file
            def autolinkingCppFile = file("${buildDir}/generated/autolinking/src/main/jni/autolinking.cpp")
            if (autolinkingCppFile.exists()) {
                def cppContent = autolinkingCppFile.text
                def cppModified = false
                
                // Check if async-storage codegen CMakeLists.txt exists
                def asyncStorageCodegenCmake = file("${project.rootDir}/../node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni/CMakeLists.txt")
                def hasAsyncStorageCodegen = asyncStorageCodegenCmake.exists()
                
                // Check if gesture-handler codegen CMakeLists.txt exists
                def gestureHandlerCodegenCmake = file("${project.rootDir}/../node_modules/react-native-gesture-handler/android/build/generated/source/codegen/jni/CMakeLists.txt")
                def hasGestureHandlerCodegen = gestureHandlerCodegenCmake.exists()
                
                // Remove includes and registrations for missing codegen
                if (!hasAsyncStorageCodegen) {
                    cppContent = cppContent.replaceAll(/#include\s+<rnasyncstorage\.h>\s*\n/, '')
                    // Remove module provider block for async-storage
                    cppContent = cppContent.replaceAll(/(?m)auto\s+module_rnasyncstorage\s*=\s*rnasyncstorage_ModuleProvider\([^)]+\);\s*\nif\s*\([^)]+\)\s*\{\s*\nreturn\s+module_rnasyncstorage;\s*\n\}\s*\n/, '')
                    cppModified = true
                }
                
                if (!hasGestureHandlerCodegen) {
                    cppContent = cppContent.replaceAll(/#include\s+<rngesturehandler_codegen\.h>\s*\n/, '')
                    cppContent = cppContent.replaceAll(/#include\s+<react\/renderer\/components\/rngesturehandler_codegen\/ComponentDescriptors\.h>\s*\n/, '')
                    // Remove module provider block for gesture-handler
                    cppContent = cppContent.replaceAll(/(?m)auto\s+module_rngesturehandler_codegen\s*=\s*rngesturehandler_codegen_ModuleProvider\([^)]+\);\s*\nif\s*\([^)]+\)\s*\{\s*\nreturn\s+module_rngesturehandler_codegen;\s*\n\}\s*\n/, '')
                    // Remove component descriptor registrations
                    cppContent = cppContent.replaceAll(/providerRegistry->add\(concreteComponentDescriptorProvider<RNGestureHandlerButtonComponentDescriptor>\(\)\);\s*\n/, '')
                    cppContent = cppContent.replaceAll(/providerRegistry->add\(concreteComponentDescriptorProvider<RNGestureHandlerRootViewComponentDescriptor>\(\)\);\s*\n/, '')
                    cppModified = true
                }
                
                if (cppModified) {
                    autolinkingCppFile.text = cppContent
                }
            }
        }
    }
}
